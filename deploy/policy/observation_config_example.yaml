# ===================================================================
# G1 Deploy - 观察配置示例（中文详细注释版）
# ===================================================================
# 此文件演示了完整的观察配置格式
# 此示例与默认配置完全匹配
#
# 使用说明:
# 1. 复制此文件以创建您的自定义配置
# 2. 修改 enabled: true/false 来启用/禁用观察项
# 3. 通过更改列表中的位置来重新排序观察项
# 4. 系统根据顺序自动计算偏移量
# 5. 确保启用的总维度与您的ONNX模型输入匹配
# ===================================================================

# 观察定义 - 按照下面列出的顺序处理
observations:
  # ---------------------------------------------------------------
  # 运动参考数据（来自加载的运动序列）
  # ---------------------------------------------------------------
  
  - name: "motion_joint_positions"          # 运动关节位置
    enabled: true                          # 启用状态：true表示启用，false表示禁用
    # 描述：来自运动参考数据的关节位置信息
    # 维度：29个元素（每个关节对应一个元素）
    # 单位：弧度
    # 目的：为当前运动帧提供目标关节位置
    
  - name: "motion_joint_velocities"        # 运动关节速度
    enabled: true                          # 启用状态
    # 描述：来自运动参考数据的关节速度信息
    # 维度：29个元素（每个关节对应一个元素）
    # 单位：弧度/秒
    # 目的：为当前运动帧提供目标关节速度
    # 注意：仅在运动播放时激活（is_playing_ = true）
    
  - name: "motion_anchor_orientation"      # 运动锚点方向
    enabled: true                          # 启用状态
    # 描述：运动锚点相对于机器人基座的方向
    # 维度：6个元素（旋转矩阵前2列展开）
    # 单位：无量纲（旋转矩阵元素）
    # 目的：编码机器人和运动参考之间的相对方向
    # 计算：包括航向补偿和航向增量调整
    
  # ---------------------------------------------------------------
  # 机器人状态数据（来自传感器和估计）
  # ---------------------------------------------------------------
  
  - name: "base_angular_velocity"          # 基座角速度
    enabled: true                          # 启用状态
    # 描述：机器人基座在身体坐标系中的角速度
    # 维度：3个元素（滚动、俯仰、偏航速率）
    # 单位：弧度/秒
    # 来源：IMU传感器数据
    # 目的：提供机器人基座的当前旋转运动
    
  - name: "body_joint_positions"           # 身体关节位置
    enabled: true                          # 启用状态
    # 描述：当前机器人关节位置
    # 维度：29个元素（每个关节对应一个元素）
    # 单位：弧度
    # 来源：通过机器人底层状态的关节编码器
    # 目的：当前实际关节位置用于反馈控制
    
  - name: "body_joint_velocities"          # 身体关节速度
    enabled: true                          # 启用状态
    # 描述：当前机器人关节速度
    # 维度：29个元素（每个关节对应一个元素）
    # 单位：弧度/秒
    # 来源：通过机器人底层状态的关节编码器
    # 目的：当前实际关节速度用于反馈控制
    
  # ---------------------------------------------------------------
  # 控制历史
  # ---------------------------------------------------------------
  
  - name: "last_actions"                   # 上次动作
    enabled: true                          # 启用状态
    # 描述：上一次控制动作输出
    # 维度：29个元素（每个关节对应一个元素）
    # 单位：无量纲（标准化动作值）
    # 目的：为时间一致性提供动作历史
    # 注意：有助于平滑控制转换

# ===================================================================
# 配置摘要
# ===================================================================
# 
# 默认配置总计:
#   - motion_joint_positions:    29维 (启用)  [偏移: 0]
#   - motion_joint_velocities:   29维 (启用)  [偏移: 29]
#   - motion_anchor_orientation:  6维 (启用)  [偏移: 58]
#   - base_angular_velocity:      3维 (启用)  [偏移: 64]
#   - body_joint_positions:      29维 (启用)  [偏移: 67]
#   - body_joint_velocities:     29维 (启用)  [偏移: 96]
#   - last_actions:              29维 (启用)  [偏移: 125]
#   ----------------------------------------------------------------
#   总启用维度:    154维
#
# 这与标准G1策略模型输入维度154相匹配
#
# ===================================================================
# 自定义配置示例
# ===================================================================
#
# 示例1: 禁用运动速度（用于仅位置策略）
# - name: "motion_joint_velocities"
#   enabled: false
#
# 示例2: 禁用上次动作（用于非时间策略）
# - name: "last_actions"
#   enabled: false
#
# 示例3: 最小配置（仅位置）
# observations:
#   - name: "motion_joint_positions"
#     enabled: true
#   - name: "body_joint_positions"
#     enabled: true
#   # 总计: 58维 (29+29)
#
# 示例4: 重新排序观察项（偏移量自动计算）
# observations:
#   - name: "body_joint_positions"     # 将获得偏移量: 0
#     enabled: true
#   - name: "motion_joint_positions"   # 将获得偏移量: 29
#     enabled: true
#   # 基于顺序的自动偏移量计算
#
# 示例5: 多帧观察与步长间隔（用于时间动态）
# observations:
#   - name: "motion_joint_positions_5frame_step5"    # 145维 (29关节 * 5帧, 步长=5)
#     enabled: true
#   - name: "motion_joint_velocities_5frame_step5"   # 145维 (29关节 * 5帧, 步长=5)  
#     enabled: true
#   - name: "base_angular_velocity"                  # 3维 (仅当前帧)
#     enabled: true
#   # 总计: 293维 (145+145+3)
#   # 捕获帧在: 当前, 当前+5, 当前+10, 当前+15, 当前+20
#
# 示例6: 不同步长的多帧观察
# observations:
#   - name: "motion_joint_positions_5frame_step10"   # 145维 (步长=10用于更长间隔)
#     enabled: true
#   # 捕获帧在: 当前, 当前+10, 当前+20, 当前+30, 当前+40
#
# 注意: 多帧观察通过采样未来帧捕获时间模式
#       在可配置的间隔（步长）下进行
#       如果未来帧超出运动长度，则重复最后一帧
#
# ===================================================================
